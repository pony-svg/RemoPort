[package]
name = "remoport-rdp"
version = "0.1.0"
edition = "2024"
description = "Remoport's RDP engine, built on IronRDP"
license = "GPL-3.0-or-later"

[dependencies]
# IronRDP, crate by crate, on the same release train RustConn uses.
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-graphics = "0.11"
ironrdp-pdu = "0.11"
ironrdp-dvc = "0.10"
ironrdp-displaycontrol = "0.10"
ironrdp-input = "0.9"
# Shared clipboard (text) and the PC's sound; the device channel carries no
# device and is there because Windows only sends sound alongside it.
ironrdp-cliprdr = "0.9"
ironrdp-rdpsnd = "0.11"
ironrdp-rdpdr = "0.9"
ironrdp-core = "0.3"
# Microphone, and shared folders over the device channel.
ironrdp-rdpeai = "0.2"
ironrdp-svc = "0.10"
nix = { version = "0.29", default-features = false, features = ["fs"] }
ironrdp-tokio = { version = "0.12", features = ["reqwest-native-tls"] }
ironrdp-tls = { version = "0.3", features = ["native-tls"] }
# RD Gateway, its certificate checked strictly against the system's authorities.
ironrdp-mstsgu = { version = "0.1", features = ["native-tls"] }
ironrdp-egfx = { version = "0.5", features = ["openh264-libloading"] }
x509-cert = "0.3"

# Server identity: chain to the system's trusted authorities, else ask.
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
sha2 = "0.10"

tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
futures = "0.3"
socket2 = { version = "0.6", features = ["all"] }
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util", "rt-multi-thread"] }
# A fake RDP server for the identity tests: a self-signed certificate over TLS.
rcgen = "0.13"
tokio-native-tls = "0.3"
tempfile = "3"
