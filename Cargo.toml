[package]
name = "remoport"
version = "0.1.0"
edition = "2021"
description = "Connect to your remote computers and apps"
license = "GPL-3.0-or-later"

[workspace]
members = ["remoport-rdp"]

[dependencies]
eframe = "0.28"
egui = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
zeroize = "1"
remoport-rdp = { path = "remoport-rdp" }
# Remembered passwords live only in the system keyring (Secret Service), and
# travel to it over an encrypted D-Bus session.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
