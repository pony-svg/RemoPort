[package]
name = "remoport"
version = "0.1.0"
edition = "2021"
description = "Connect to your remote computers and apps"
license = "GPL-3.0-or-later"

[workspace]
members = ["remoport-core", "remoport-rdp"]

[dependencies]
eframe = "0.28"
egui = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
zeroize = "1"
remoport-core = { path = "remoport-core" }
remoport-rdp = { path = "remoport-rdp" }
# Remembered passwords live only in the system keyring (Secret Service), and
# travel to it over an encrypted D-Bus session.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# The PC's sound on this computer's speakers.
cpal = "0.18"
# Full-screen sessions take the desktop's reserved keys; see src/key_grab.rs.
raw-window-handle = "0.6"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
nix = { version = "0.29", default-features = false, features = ["poll"] }
