[package]
name = "remoport"
version = "0.1.0"
edition = "2021"
description = "Connect to your remote computers and apps"
license = "GPL-3.0-or-later"

[workspace]

[dependencies]
eframe = "0.28"
egui = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
zeroize = "1"
# RustConn's IronRDP engine (GPL-3.0-or-later), pinned to a reviewed commit.
rustconn-core = { git = "https://github.com/totoshko88/RustConn", rev = "a997e0de6e3536d149c95c26dfa358cc4021238d", features = ["rdp-embedded", "gfx-h264"] }
