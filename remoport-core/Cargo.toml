[package]
name = "remoport-core"
version = "0.1.0"
edition = "2021"
description = "Platform- and UI-independent application core for Remoport"
license = "GPL-3.0-or-later"

[dependencies]
remoport-rdp = { path = "../remoport-rdp" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
zeroize = "1"
emath = "0.28"
